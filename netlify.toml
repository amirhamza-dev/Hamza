[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Official Netlify Next.js Runtime.
# It is auto-installed by Netlify when declared here, and it handles the
# App Router, server components, image optimization and caching in production.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
